version: "1.0"
last_updated: "2025-11-14"

# Registry metadata
registry:
  auto_discovery: false  # [Future] Enable auto-scanning GitHub
  monitoring_enabled: false  # [Future] Daily health checks

# Tracked repositories
repositories:
  - id: cline
    name: "Cline (formerly Claude Dev)"
    url: "https://github.com/cline/cline"
    type: "vscode-extension"
    language: "typescript"
    focus_areas:
      - llm_integration
      - diff_application
      - tool_use
    analysis_priority: high
    tags: ["agentic", "vscode", "anthropic"]

  - id: continue
    name: "Continue"
    url: "https://github.com/continuedev/continue"
    type: "multi-ide-extension"
    language: "typescript"
    focus_areas:
      - multi_provider
      - context_management
      - autocomplete
    analysis_priority: high
    tags: ["vscode", "jetbrains", "multi-llm"]

  - id: gpt-engineer
    name: "GPT Engineer"
    url: "https://github.com/AntonOsika/gpt-engineer"
    type: "cli-agent"
    language: "python"
    focus_areas:
      - autonomous_coding
      - project_generation
      - prompt_engineering
    analysis_priority: medium
    tags: ["cli", "autonomous", "openai"]

# [Future] Auto-discovery rules
discovery:
  enabled: false
  sources:
    - github_topics: ["ai-ide", "ai-coding-assistant"]
    - github_search: "language:TypeScript ai code editor"
  filters:
    min_stars: 1000
    has_activity_last_months: 6
