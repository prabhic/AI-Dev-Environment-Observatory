# Repository Metadata Schema
# Defines the structure for repository entries in repos.yaml

repository_schema:
  id:
    type: string
    required: true
    description: "Unique identifier for the repository"

  name:
    type: string
    required: true
    description: "Human-readable name"

  url:
    type: string
    required: true
    format: url
    description: "Git clone URL"

  type:
    type: string
    required: true
    enum: ["vscode-extension", "multi-ide-extension", "cli-agent", "web-ide", "framework"]
    description: "Repository category"

  language:
    type: string
    required: true
    description: "Primary programming language"

  focus_areas:
    type: array
    required: true
    items:
      type: string
    description: "Key areas of focus for analysis"

  analysis_priority:
    type: string
    required: false
    enum: ["low", "medium", "high", "critical"]
    default: "medium"

  tags:
    type: array
    required: false
    items:
      type: string
    description: "Searchable tags"

  # [Future] Fields
  last_analyzed:
    type: datetime
    required: false

  health_status:
    type: string
    required: false
    enum: ["active", "stale", "archived"]
