[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ide-observatory"
version = "1.0.0"
description = "Self-evolving research platform for AI-IDE architecture analysis"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "AI-IDE Observatory"}
]
dependencies = [
    "anthropic>=0.39.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "gitpython>=3.1.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "pathspec>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
observatory = "run:main"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools]
packages = ["registry", "analyzers", "intelligence", "storage", "pipeline", "steering"]
